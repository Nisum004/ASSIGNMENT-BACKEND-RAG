[project]
name = "assignment-backend-rag"
description = "FastAPI backend for document ingestion and conversational RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "openai>=1.35.0",
    "pinecone>=5.0.0",
    "qdrant-client>=1.9.0",
    "weaviate-client>=4.6.0",
    "pymilvus>=2.4.0",
    "pypdf>=4.2.0",
    "email-validator>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "TRY"]
ignore = [
    "B008",   
    "TRY003", 
]
